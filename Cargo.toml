[package]
name = "eggg-solver"
version = "0.1.0"
edition = "2024"
description = "Fast three-phase 4x4x4 Rubik's cube solver (outer block turn metric)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_xoshiro = "0.6"
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
debug = 1

[profile.test]
opt-level = 3

[lints.clippy]
# Index loops over piece slots read better than iterator chains in cube code.
needless_range_loop = "allow"
